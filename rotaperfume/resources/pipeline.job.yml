# O pipeline da noite. UM job, que ganha UMA tarefa por entrega -- nao um job
# por etapa. Ao final das seis entregas ele fica assim:
#
#   raw_conferencia          (entrega 1 - FEITA) - os 10 arquivos chegaram ao Volume?
#        v
#   bronze_ingestao          (entrega 2 - FEITA) - arquivo vira tabela, 10 tabelas bronze
#        v
#   silver_clientes / silver_pedidos / silver_itens_produtos /
#   silver_crm_financeiro    (entrega 3 - FEITA) - limpeza, tipos e contrato.
#                            As quatro rodam EM PARALELO: nenhuma depende da outra.
#        v
#   gold_dimensoes -> gold_fato_vendas -> gold_marts -> testes
#                            (entrega 4 - FEITA) - modelagem para consumo,
#                            e os 9 testes que PARAM o job se o numero mudar.
#        v
#   qualidade_expectativas   (entrega 5) - o pipeline se auto-audita
#        v
#   publicacao_dashboard     (entrega 6) - o numero chega em quem decide
#
# Cada tarefa depende da anterior: se o raw nao chegou, nada depois roda.
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: Pipeline do lakehouse de vendas - do arquivo cru ate a metrica.

      # Serverless: nenhuma tarefa declara cluster. No Free Edition e a unica
      # opcao, e e a que a gente quer de qualquer jeito.
      tasks:
        - task_key: raw_conferencia
          description: Confere se os 10 arquivos esperados chegaram ao Volume, e para o job se nao chegaram.
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        # A ordem e o conteudo: sem depends_on, a bronze rodaria em paralelo com
        # a conferencia e ingeriria um Volume que talvez esteja incompleto.
        # Com ele, arquivo que nao chegou para o pipeline antes de virar tabela.
        - task_key: bronze_ingestao
          description: Le os 10 CSVs do Volume e grava as 10 tabelas Delta da bronze, tudo como texto.
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        # ---------------------------------------------------------------
        # ENTREGA 3 - a silver. Quatro sql_task que dependem todas da
        # bronze e de nenhuma outra: rodam em paralelo.
        # Arquivo .sql com varias instrucoes separadas por ';' -- o
        # CREATE, os COMMENT e os ADD CONSTRAINT cabem no mesmo arquivo.
        # ---------------------------------------------------------------
        - task_key: silver_clientes
          description: Normaliza CNPJ, deduplica por CNPJ mantendo o cadastro mais antigo e declara o contrato.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql

        - task_key: silver_pedidos
          description: Converte datas nos dois formatos, tipa valores e separa cancelado de faturado.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql

        - task_key: silver_itens_produtos
          description: Sinaliza devolucao e SKU descontinuado sem descartar nenhuma linha.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql

        - task_key: silver_crm_financeiro
          description: Vendedores, carteira, oportunidades, visitas, pagamentos e estoque - expondo a carteira orfa.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql

        # ---------------------------------------------------------------
        # ENTREGA 4 - a gold. Em serie: dimensao antes do fato, fato antes
        # do mart, e os testes por ULTIMO. A ordem e o conteudo.
        # ---------------------------------------------------------------
        - task_key: gold_dimensoes
          description: Quatro dimensoes conformadas - cliente, produto, vendedor e calendario.
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql

        - task_key: gold_fato_vendas
          description: Fato no grao de item de pedido, sem cancelado e COM devolucao sinalizada.
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql

        - task_key: gold_marts
          description: Tres marts por diretoria, todos conformados com o mesmo fato.
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql

        # Obrigatoria e por ultimo: se um teste falhar, o job para aqui e
        # o dashboard fica com o dado de ontem em vez do dado errado de hoje.
        - task_key: testes
          description: Os 9 testes de qualidade. Gravam em gold._testes_qualidade e derrubam o job se algum falhar.
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql

      # Todo dia as 6h de Sao Paulo. No target dev isso nasce PAUSED, por causa
      # do `presets: trigger_pause_status` do databricks.yml.
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Sao_Paulo

      queue:
        enabled: true
